<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="50%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>

    <!-- Neon Emerald Gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55FFB2"/>
      <stop offset="50%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00B862"/>
    </linearGradient>

    <!-- Holographic Cyan Gradient -->
    <linearGradient id="holoCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>

    <!-- Luxury Gold Accent -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259"/>
      <stop offset="100%" stop-color="#FFA751"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="url(#neonGreen)" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- Futuristic Cyber Rings (Smart Mirror Radar) -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#holoCyan)" stroke-width="1.5" stroke-dasharray="14 18" opacity="0.3"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#neonGreen)" stroke-width="1" stroke-dasharray="6 12" opacity="0.2"/>

  <!-- Geometric Hanger & Coat Silhouette -->
  <!-- Hanger Hook -->
  <path d="M 256 122 C 274 122, 288 136, 288 152 C 288 174, 266 186, 256 200 L 256 218"
        fill="none" stroke="url(#neonGreen)" stroke-width="14" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Hanger Shoulders Base -->
  <path d="M 120 286 L 256 218 L 392 286"
        fill="none" stroke="url(#neonGreen)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Stylized Dress / Tuxedo Contour Lines -->
  <!-- Left Lapel / Drape -->
  <path d="M 210 242 L 152 400 C 180 412, 215 418, 256 418"
        fill="none" stroke="url(#holoCyan)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Right Lapel / Drape -->
  <path d="M 302 242 L 360 400 C 332 412, 297 418, 256 418"
        fill="none" stroke="url(#neonGreen)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Central Smart Mirror Beam (VTON Inpainting Wave) -->
  <line x1="160" y1="330" x2="352" y2="330" stroke="url(#neonGreen)" stroke-width="3" stroke-dasharray="8 6" opacity="0.8"/>
  <line x1="184" y1="365" x2="328" y2="365" stroke="url(#holoCyan)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Floating Sparkles (AI Generation Nodes) -->
  <polygon points="256,70 262,86 278,92 262,98 256,114 250,98 234,92 250,86" fill="url(#goldAccent)" filter="url(#softGlow)"/>
  <polygon points="110,210 114,222 126,226 114,230 110,242 106,230 94,226 106,222" fill="#00FF88" filter="url(#softGlow)"/>
  <polygon points="400,210 404,222 416,226 404,230 400,242 396,230 384,226 396,222" fill="#00F0FF" filter="url(#softGlow)"/>

  <!-- Core Diamond Crystal -->
  <circle cx="256" cy="220" r="10" fill="#ffffff" filter="url(#softGlow)"/>
</svg>

